<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>纳指·标普 ETF 溢价率看板</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1d2129;--mut:#86909c;--line:#e5e6eb;--hov:#f2f3f5;--acc:#3b6cf6;--up:#e8423f;--dn:#16a35b}
[data-theme=dark]{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--mut:#7d8590;--line:#262c36;--hov:#1c2230;--acc:#5b8cff;--up:#ff5d5a;--dn:#2fbf71}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0;flex:1}h1 small{font-size:13px;color:var(--mut);font-weight:400;margin-left:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}.btn:hover{border-color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.card .k{color:var(--mut);font-size:12px}.card .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.card .s{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:var(--mut);padding:6px 16px;border-radius:7px;cursor:pointer;font-size:13px}.tabs button.on{background:var(--acc);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--mut);font-weight:500;cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}
th.l,td.l{text-align:left}th.on{color:var(--acc)}tbody tr{cursor:pointer}tbody tr:hover{background:var(--hov)}tr:last-child td{border:0}
.nm{font-weight:600}.cd{color:var(--mut);font-size:12px}.tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mut)}
.up{color:var(--up)}.dn{color:var(--dn)}.pill{display:inline-block;min-width:72px;text-align:center;font-weight:700;border-radius:6px;padding:3px 8px}
.spark{width:110px;height:30px}
.status{margin-top:8px;color:var(--mut);font-size:12px}.status.error{color:var(--up)}
.note{color:var(--mut);font-size:12px;margin-top:14px;line-height:1.8}
.premium-tip{width:min(490px,calc(100vw - 96px))}.premium-tip-date{font-weight:700;margin-bottom:6px}
.premium-tip-hint{display:none;color:#86909c;font-size:11px;font-weight:400;margin-left:8px}
.premium-tip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 14px;max-height:min(270px,55vh);overflow-y:auto}
.premium-tip-item{display:flex;justify-content:space-between;gap:8px;min-width:0;font-size:12px;white-space:nowrap}
.premium-tip-name{min-width:0;overflow:hidden;text-overflow:ellipsis}.premium-tip-item b{flex:none;font-weight:600}
#cmp{height:360px}.sec{margin-top:18px}.sec h3{font-size:15px;margin:0 0 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}.modal.on{display:flex}
body.modal-open{overflow:hidden}
.box{background:var(--card);border-radius:14px;width:min(960px,100%);max-height:94vh;overflow:auto;padding:18px}
.box .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.box h2{margin:0;font-size:18px;flex:1}#mtMeta::before{content:' · '}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stats div{background:var(--hov);border-radius:8px;padding:8px 10px}.stats b{display:block;font-size:16px}.stats span{font-size:12px;color:var(--mut)}
.ch{height:300px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.cards .card:first-child{grid-column:span 2}.card .v{font-size:20px}
 .hide-m{display:none}table{table-layout:fixed}th,td{padding:9px 4px;overflow:hidden;text-overflow:ellipsis}
 th:first-child,td:first-child{width:38%;white-space:normal}th:nth-child(3),td:nth-child(3){width:18%}
 th:nth-child(4),td:nth-child(4){width:21%}th:nth-child(8),td:nth-child(8){width:23%}
 td:not(:first-child){font-size:12px}
 .nm{overflow-wrap:anywhere}.cd{white-space:normal;line-height:1.35}.tag{display:inline-block;margin-top:2px;padding:1px 3px;font-size:10px;white-space:nowrap}
 .pill{min-width:0;padding:2px 4px}.spark{width:70px}h1{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}.ch{height:240px}#cmp{height:300px}
 .box .hd{display:grid;grid-template-columns:minmax(0,1fr) auto}.box h2{grid-column:1;grid-row:1;min-width:0;font-size:16px}
 #mtMeta{display:block;color:var(--mut);font-size:12px;font-weight:400}#mtMeta::before{content:none}
 #closeModal{grid-column:2;grid-row:1;align-self:start}#rng{grid-column:1/-1;grid-row:2;display:flex;max-width:100%;overflow-x:auto}
 #rng button{flex:1 0 auto;padding:6px 8px;white-space:nowrap}#cmpR button{padding:6px 7px;white-space:nowrap}
 .premium-tip-grid{grid-template-columns:1fr;max-height:205px}
 .premium-tip-hint{display:inline}}
</style></head><body><div class="wrap">
<header><h1>纳指 · 标普 ETF 溢价率<small>A股场内 QDII</small></h1>
<button class="btn" id="theme">☀️ 浅色</button></header>
    <div id="status" role="status" aria-live="polite" class="status">行情加载中…</div>
<div class="cards" id="cards"></div>
<div class="bar"><div class="tabs" id="tabs"><button data-g="" class="on">全部</button><button data-g="纳指">纳指</button><button data-g="标普">标普</button></div>
<span class="cd" id="cnt"></span></div>
<div class="panel"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table></div>
<div class="sec panel" style="padding:14px"><div class="bar" style="justify-content:space-between"><h3>溢价率对比（收盘价/当日净值−1）</h3><div class="tabs" id="cmpR"></div></div><div id="cmp"></div><div id="cmpNote" class="cd"></div></div>
<div class="note">参考溢价率 = 最近入库现价 / 参考净值 − 1；参考净值优先使用 IOPV，无 IOPV 时使用最新公布 NAV。顶部汇总使用有参考溢价的 ETF，非交易时段显示最近一次报价的结果；报价时间及 NAV 日期见页面标注。历史日度溢价 = 当日收盘价 / 同一估值日 T 的官方单位净值 − 1；QDII 净值 T 日对应当晚美股收盘，通常 T+1~T+2 公布，故最近 1–2 天暂无日度数据。<br>数据来源：东方财富、新浪财经。仅供参考，不构成投资建议。</div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="box">
<div class="hd"><h2 id="mt"><span id="mtName"></span><span id="mtMeta"></span></h2><div class="tabs" id="rng"></div><button class="btn" id="closeModal" aria-label="关闭详情">✕</button></div>
<div class="stats" id="mstats"></div><div id="c1" class="ch"></div><div id="c2" class="ch"></div></div></div>
<script src="/app.js"></script></body></html>
